name: Build README

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "17 1 * * *" # every day at 06:47 IST

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Update README
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Optional: read-only token for private repos (only their last push date is used)
          PROFILE_TOKEN: ${{ secrets.PROFILE_TOKEN }}
        run: python build_readme.py
      - name: Commit if changed
        run: |
          git diff --quiet README.md && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "Update README"
          git push
